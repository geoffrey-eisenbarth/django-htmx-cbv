[project]
name = "django-htmx-cbv"
version = "0.0.1.dev1"
description = "Django class-based views, tailored for htmx"
authors = [
    {name = "Geoffrey Eisenbarth",email = "geoffrey.eisenbarth@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.0,<7.0.0",
    "django-htmx>=1.27.0,<2.0.0",
]

[dependency-groups]
dev = [
    "ipython>=9.12.0,<10.0.0",
    "ipdb>=0.13.13,<0.14.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "django-stubs>=6.0.2,<7.0.0",
    "django-stubs-ext>=6.0.2,<7.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-django>=4.12.0,<5.0.0",
    "codecov>=2.1.13,<3.0.0",
    "parameterized>=0.9.0,<0.10.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "pre-commit>=4.5.1,<5.0.0",
    "coverage>=7.13.5",
]


[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py314"
exclude = [
  "*/migrations/*",
  "manage.py",
  "settings.py",
  "local_settings.py",
  "vendor.py",
]

[tool.ruff.lint]
select = [
  "E",        # pycodestyle errors
  "W",        # pycodestyle warnings
  "F",        # pyflakes (unused imports, undefined names, etc.)
  "I",        # isort (automatically sorts and organizes imports)
  "UP",       # pyupgrade (modernizes Python syntax)
  "RUF100",   # flags unused noqa comments
  "DJ",       # flake8-django
]
ignore = [
  "E111",  # Indentation is not a multiple of four
  "E114",  # Comment indentation is not a multiple of four
  "E731",  # Do not assign a lambda expression, use a def
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["tests/project"]

[tool.coverage.run]
branch = true
source = ["django_htmx_cbv"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
packages = ["django_htmx_cbv", "tests"]
exclude = [
  "future.py",
  "tests/project/manage.py",
  "tests/project/project",
]

[[tool.mypy.overrides]]
module = ["tests.project.test_middleware"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "tests.project.project.settings"
